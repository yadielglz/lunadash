name: Desktop Builds

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: desktop:build:win
            artifact: LunaDash-Windows
            paths: |
              release/*.exe
              release/*.blockmap
              release/latest.yml
          - os: ubuntu-latest
            script: desktop:build:linux
            artifact: LunaDash-Linux
            paths: |
              release/*.AppImage
              release/*.deb
              release/latest-linux.yml
          - os: macos-latest
            script: desktop:build:mac
            artifact: LunaDash-macOS
            paths: |
              release/*.dmg
              release/*.zip
              release/latest-mac.yml

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run ${{ matrix.script }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error
